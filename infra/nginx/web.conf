# The web tier serves the SPA and is the ONLY way into `api` from a browser,
# in EVERY environment. That last clause is the point of this file.
#
# `api` is reachable at ${API_UPSTREAM}, substituted at container start
# (nginx's own /etc/nginx/templates mechanism) so the SAME image serves
# compose and Azure: `api:8080` on the compose network, the Container App's
# internal FQDN in Azure. The SPA is built with VITE_API_BASE_URL=/api in
# both, so the browser only ever calls its own origin.
#
# Why this matters beyond tidiness: giving `api` its own public hostname in
# Azure (as an earlier version did) made every browser call cross-origin,
# and `apps/api` has no CORS handling at all — so the whole app worked in
# compose and would have failed on the first request in Azure, at the one
# layer local development cannot exercise. Same-origin everywhere means
# there is no CORS policy in this system to get wrong or to widen later.
#
# This proxy is not a convenience — it is what makes §5's central claim
# expressible in compose at all. `api` must have no route to the internet,
# and in Docker a container gets outbound access from being attached to ANY
# non-internal network. So `api` can only sit on `internal`, which also means
# it cannot publish a host port (an internal network drops host<->container
# traffic in both directions, not just outbound). Something reachable from
# the host therefore has to reach it on the browser's behalf, and that is
# this server block.
#
# It also removes cross-origin entirely: the SPA is built with
# VITE_API_BASE_URL=/api, so the browser calls its own origin and nothing
# needs a CORS policy that a later change could quietly widen.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # `api` resolves on the `internal` network only. Named explicitly rather
  # than relying on a default, so a missing network fails loudly here.
  location /api/ {
    # nginx's default is 1 MiB, and it sits IN FRONT of apps/api's declared
    # limit — so without this line the smaller, undeclared cap wins and
    # apps/api's configured one never applies to a browser at all. A scanned
    # document's page images arrive as base64 in `InferRequest.images` and
    # run to many megabytes; they would die here with a bare nginx 413,
    # blamed on neither limit, and unfixable by the setting that looks like
    # it governs them.
    #
    # Scanned documents are this app's core case — reviewing one as though it
    # said nothing is its founding defect — so a proxy hop that silently
    # refuses them is exactly the wrong place to accept a default.
    #
    # 0 disables nginx's own check and defers to apps/api, which declares the
    # limit (API_MAX_BODY_BYTES), reports it in its boot banner, and answers
    # an over-large body with its own error rather than a proxy's. One limit,
    # in the tier that can explain it.
    client_max_body_size 0;

    # Resolve `api` PER REQUEST, via Docker's embedded DNS.
    #
    # nginx resolves a literal `proxy_pass` hostname once, at config-load
    # time, and refuses to start if it does not resolve — which is exactly
    # what happened here: `web` exited with
    #   [emerg] host not found in upstream "api"
    # because nginx came up before `api` had a DNS entry. `depends_on` alone
    # would only paper over the startup ordering; nginx would still hold one
    # address forever, so an `api` restart on a new IP would leave the proxy
    # pointing at nothing until someone restarted the web container too.
    #
    # A variable in `proxy_pass` defers resolution to request time, so both
    # problems go away. The `rewrite` is then required: `proxy_pass` with a
    # variable does not perform the trailing-slash URI substitution, so the
    # /api prefix has to be stripped explicitly.
    #
    # AND IT IS WHAT MAKES TWO REPLICAS WORK AT ALL (Stage 4 Task 14).
    # `docker-compose.yml` runs `api` at `replicas: 2`, so `api` has two A
    # records on the `internal` network; per-request resolution is what lets
    # successive requests reach different containers. A literal `proxy_pass
    # http://api:8080` would have pinned every request to whichever address
    # nginx happened to resolve at config-load time — one replica serving
    # everything, the second idle, and the cross-replica fan-out that §8
    # depends on untested because the condition never arose.
    resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
    set $api_upstream ${API_UPSTREAM};
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The streaming route is the reason for the three lines below: buffering
    # would hold SSE frames until the response completed, which turns a
    # streamed answer into a non-streamed one that merely took longer, and
    # a truncated stream into one the browser never sees truncate.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
  }

  # SPA fallback, after /api/ so it can never swallow an API path.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
