# The web tier serves the SPA and is the ONLY way into `api` from a browser,
# in EVERY environment. That last clause is the point of this file.
#
# `api` is reachable at ${API_UPSTREAM}, substituted at container start
# (nginx's own /etc/nginx/templates mechanism) so the SAME image serves
# compose and Azure: `api:8080` on the compose network, the Container App's
# internal FQDN in Azure. The SPA is built with VITE_API_BASE_URL=/api in
# both, so the browser only ever calls its own origin.
#
# Why this matters beyond tidiness: giving `api` its own public hostname in
# Azure (as an earlier version did) made every browser call cross-origin,
# and `apps/api` has no CORS handling at all — so the whole app worked in
# compose and would have failed on the first request in Azure, at the one
# layer local development cannot exercise. Same-origin everywhere means
# there is no CORS policy in this system to get wrong or to widen later.
#
# This proxy is not a convenience — it is what makes §5's central claim
# expressible in compose at all. `api` must have no route to the internet,
# and in Docker a container gets outbound access from being attached to ANY
# non-internal network. So `api` can only sit on `internal`, which also means
# it cannot publish a host port (an internal network drops host<->container
# traffic in both directions, not just outbound). Something reachable from
# the host therefore has to reach it on the browser's behalf, and that is
# this server block.
#
# It also removes cross-origin entirely: the SPA is built with
# VITE_API_BASE_URL=/api, so the browser calls its own origin and nothing
# needs a CORS policy that a later change could quietly widen.
# The standard `Connection` mapping for a proxied WebSocket upgrade, WRITTEN
# OUT rather than referenced, because a reader of this file should not have to
# know it.
#
# `$http_upgrade` is empty on an ordinary request, and this maps that to
# `close` — which is why the upgrade headers go on their OWN location below
# rather than on `/api/`. Setting `Connection: $http_upgrade` on every request
# produces `Connection: ""` on all of them, which has bitten enough
# deployments to be folklore.
#
# At file scope, outside `server`, because `map` is an http-context directive
# and this file is included from `http {}` (nginx's entrypoint renders
# /etc/nginx/templates/*.template into /etc/nginx/conf.d/). envsubst rewrites
# only the ${NAME} forms of variables that exist in the environment, so
# nginx's own $http_upgrade and $connection_upgrade pass through untouched.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # `.mjs` IS JAVASCRIPT, AND NGINX DOES NOT KNOW THAT.
  #
  # nginx 1.27's stock `mime.types` has no `mjs` entry, so an `.mjs` file is
  # served as `application/octet-stream` — and a browser REFUSES to execute a
  # module served with a non-JavaScript MIME type. It is not a 404: the byte
  # range is fetched, 200, and then discarded, which is why the failure reads
  # as `Failed to fetch dynamically imported module` and sends a reader
  # looking for a missing asset that is right there.
  #
  # What this breaks is not cosmetic. `pdf.js`'s worker ships as
  # `assets/pdf.worker-*.mjs` and is loaded by dynamic import, so without this
  # line the DOCUMENT VIEWER NEVER OPENS A PDF in any containerised
  # deployment — "Could not open PDF: Setting up fake worker failed" beside
  # every finding, and no citation checkable against its source. Found by
  # driving the compose stack in a browser; `npm run build` and the whole unit
  # suite are green with it broken, because Vite's dev server sets the type
  # itself and nothing in the test suite fetches an asset over HTTP.
  #
  # THE `include` ON THE LINE BELOW IS LOAD-BEARING, and the first version of
  # this fix did not have it. A `types` block in a NESTED context REPLACES the
  # inherited map rather than adding to it — so a bare `types { ...
  # mjs; }` here fixed `.mjs` and broke everything else, serving the entry
  # chunk and the stylesheet as `application/octet-stream` and taking the
  # whole app down instead of just the viewer. Re-including the stock map in
  # THIS context first, then adding to it, is what makes the addition an
  # addition. Both halves are asserted in
  # `apps/api/test/webAssets.compose.test.ts`, which is how the broken first
  # version was caught within a minute of being deployed — it walks every
  # chunk, not only the one that was reported broken.
  include /etc/nginx/mime.types;
  types {
    application/javascript mjs;
  }

  # THE WEBSOCKET HOP (Stage 4 §8, Task 17).
  #
  # A SEPARATE location, and a longer prefix than /api/ so nginx picks it
  # first whatever the order in this file — the upgrade headers then apply to
  # the socket and to nothing else.
  #
  # Before this block the handshake FAILED HERE, at the one hop local
  # development can exercise: /api/ sets `proxy_http_version 1.1` and no
  # `Upgrade`/`Connection` headers at all, so nginx forwarded a plain GET,
  # `api` answered 426, and the browser reported a close with no readable
  # cause. That is precisely the class of defect this file's own comments
  # describe — "broken at the one layer local development cannot exercise" —
  # except that here it CAN be exercised, so it is, in the container
  # (`apps/api/test/wsProxy.compose.test.ts`).
  location /api/v1/ws {
    # Per-request resolution, for the reason the /api/ block explains at
    # length: a literal hostname is resolved once at config-load time, and
    # `api` runs at two replicas.
    resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
    set $api_upstream ${API_UPSTREAM};
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$api_upstream;

    # REQUIRED. HTTP/1.0 has no upgrade at all, so without this line the
    # handshake cannot happen however the headers are set.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A SOCKET IS IDLE MOST OF THE TIME, and this timeout is what decides
    # whether that is allowed. It must exceed API_WS_PING_MS (25s, declared
    # in apps/api/src/config.ts and printed in the boot banner): below it,
    # every idle socket would be killed on a schedule and the app would look
    # like a network with a fault, which is a worse failure than no socket at
    # all because it is intermittent. The relationship between these two
    # numbers in two files is exactly what silently inverts when somebody
    # tunes one of them, so wsProxy.compose.test.ts asserts it rather than
    # trusting this comment.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    # NO `client_max_body_size 0` here, deliberately: a client frame is
    # capped at API_WS_MAX_FRAME_BYTES by `ws` itself, and a request body has
    # no meaning on an upgrade.
  }

  # `api` resolves on the `internal` network only. Named explicitly rather
  # than relying on a default, so a missing network fails loudly here.
  location /api/ {
    # nginx's default is 1 MiB, and it sits IN FRONT of apps/api's declared
    # limit — so without this line the smaller, undeclared cap wins and
    # apps/api's configured one never applies to a browser at all. A scanned
    # document's page images arrive as base64 in `InferRequest.images` and
    # run to many megabytes; they would die here with a bare nginx 413,
    # blamed on neither limit, and unfixable by the setting that looks like
    # it governs them.
    #
    # Scanned documents are this app's core case — reviewing one as though it
    # said nothing is its founding defect — so a proxy hop that silently
    # refuses them is exactly the wrong place to accept a default.
    #
    # 0 disables nginx's own check and defers to apps/api, which declares the
    # limit (API_MAX_BODY_BYTES), reports it in its boot banner, and answers
    # an over-large body with its own error rather than a proxy's. One limit,
    # in the tier that can explain it.
    client_max_body_size 0;

    # Resolve `api` PER REQUEST, via Docker's embedded DNS.
    #
    # nginx resolves a literal `proxy_pass` hostname once, at config-load
    # time, and refuses to start if it does not resolve — which is exactly
    # what happened here: `web` exited with
    #   [emerg] host not found in upstream "api"
    # because nginx came up before `api` had a DNS entry. `depends_on` alone
    # would only paper over the startup ordering; nginx would still hold one
    # address forever, so an `api` restart on a new IP would leave the proxy
    # pointing at nothing until someone restarted the web container too.
    #
    # A variable in `proxy_pass` defers resolution to request time, so both
    # problems go away. The `rewrite` is then required: `proxy_pass` with a
    # variable does not perform the trailing-slash URI substitution, so the
    # /api prefix has to be stripped explicitly.
    #
    # AND IT IS WHAT MAKES TWO REPLICAS WORK AT ALL (Stage 4 Task 14).
    # `docker-compose.yml` runs `api` at `replicas: 2`, so `api` has two A
    # records on the `internal` network; per-request resolution is what lets
    # successive requests reach different containers. A literal `proxy_pass
    # http://api:8080` would have pinned every request to whichever address
    # nginx happened to resolve at config-load time — one replica serving
    # everything, the second idle, and the cross-replica fan-out that §8
    # depends on untested because the condition never arose.
    resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
    set $api_upstream ${API_UPSTREAM};
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The streaming route is the reason for the three lines below: buffering
    # would hold SSE frames until the response completed, which turns a
    # streamed answer into a non-streamed one that merely took longer, and
    # a truncated stream into one the browser never sees truncate.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
  }

  # SPA fallback, after /api/ so it can never swallow an API path.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
