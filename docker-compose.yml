name: lexprompt

networks:
  # Three networks, and which containers join which IS the isolation. There
  # is no firewall rule here to read past: a container can reach the internet
  # if and only if it is attached to a network that is not `internal: true`.
  #
  # That sentence is the whole trap. An earlier version had `api` on
  # `frontend` as well and reasoned "api is not on `egress`, therefore api
  # cannot egress". The premise was true and the conclusion did not follow:
  # `frontend` is routable, so `api` held `default via 172.21.0.1` and had
  # full outbound access while this file still read as correct. Reading the
  # topology said it was fine; `npm run test:compose` said it was not.
  #
  # `frontend` — routable, and it has to be. An `internal` network drops
  # host<->container traffic in BOTH directions, so marking this one internal
  # removes every published port (verified: the PORTS column goes bare) and
  # nothing is reachable from a browser. Only `web` and `keycloak` sit here.
  # Both therefore DO have outbound internet access; neither holds a provider
  # credential, and `web` is nginx serving static files plus a proxy hop to
  # `api`. `npm run test:compose` does not probe either of them, so that is a
  # documented property rather than a tested one.
  frontend:

  # `internal` — no default route, so nothing attached here can reach the
  # internet through it. `api` sits on this network ALONE, which is what
  # makes §5's central claim true: it holds no route out, and reaches the
  # gateway and Keycloak over this network only. It publishes no port
  # either; a browser reaches it through `web`'s nginx proxy.
  internal:
    internal: true

  # `egress` — the network the model providers are reached over. `gateway`
  # is the only service that joins it, and `gateway` is the only service
  # holding a provider credential. It is NOT the only routable network in
  # this file (see `frontend` above) — it is the only one that any
  # credential-holding service is attached to.
  egress:

services:
  # The local OIDC issuer (S31). NOT an Entra emulator — it implements the
  # same protocol Entra implements, which is a different and weaker claim,
  # and §5.1's "what local does not prove" list is where the difference bites.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    ports: ["8088:8080"]          # published so a BROWSER can redirect to it
    networks: [frontend, internal]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # ONE issuer, whatever host a request arrives on.
      #
      # Without this, `start-dev` derives the frontend URL — and therefore the
      # `iss` claim it stamps into every token — from the incoming request's
      # Host header. A browser signing in through the published port got
      # `iss: http://localhost:8088/realms/lexprompt`; `api`, reaching the
      # same Keycloak over the `internal` network, was configured to demand
      # `http://keycloak:8080/realms/lexprompt`. jose compares `iss` as an
      # exact string, so the signature verified and the issuer did not: every
      # locally issued token returned 401 `sign_in_required`, and the only
      # action the message offered was to sign in again, which produced the
      # same 401 forever. Verified by reading the discovery document from both
      # hosts before this line existed; they disagreed exactly here.
      KC_HOSTNAME: http://localhost:8088
      # …but the BACKCHANNEL must stay dynamic, or the discovery document
      # served on `internal` would name `localhost:8088` as its `jwks_uri` —
      # an address that does not resolve from inside another container, so
      # `api` could no longer fetch the keys it validates with. Frontend URLs
      # (and `iss`) come from KC_HOSTNAME above; endpoint URLs are resolved
      # per request. That split IS the fix: one issuer string, two reachable
      # addresses, said out loud instead of collapsed into one value.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - "./infra/keycloak:/opt/keycloak/data/import:ro"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 5s
      retries: 30

  web:
    # The web app is a Vite SPA: every VITE_* value src/lib/config.ts reads
    # is INLINED into the static bundle at BUILD time (see vite.config.ts —
    # there is no runtime env injection for a prebuilt bundle). They must
    # arrive as build `args`, not as this service's runtime `environment` —
    # a `docker build` run with none of these set would bake a bundle that
    # throws "VITE_API_BASE_URL is not configured" in every browser tab,
    # and setting them under `environment:` afterwards would have no effect
    # on the already-built files at all.
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Same origin, proxied by this container's own nginx to api:8080 over
        # `internal`. Not http://localhost:8080: `api` publishes no port,
        # and a same-origin path also means no CORS policy exists to widen.
        VITE_API_BASE_URL: /api
        # The issuer the BROWSER redirects to, so it is the published host
        # address rather than the compose service name. `api` validates this
        # SAME string — see its own comment below.
        VITE_OIDC_ISSUER: ${OIDC_ISSUER_BROWSER}
        VITE_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
        VITE_OIDC_SCOPE: ${OIDC_SCOPE}
    ports: ["3005:80"]
    # `frontend` for the published port a browser connects to, `internal` to
    # reach `api` — which has no port of its own by design.
    environment:
      # Where nginx proxies /api/ to, substituted into the conf template at
      # container start. Set explicitly rather than left to the image default,
      # because Azure sets this same variable to the api Container App's
      # internal FQDN — one image, one seam, two values.
      API_UPSTREAM: api:8080
    depends_on: [api]
    networks: [frontend, internal]

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    # NO published port and `internal` ONLY. This is §5's central claim as a
    # network fact rather than a code review, and the shape is forced:
    # outbound access in Docker comes from being attached to ANY non-internal
    # network, not from being attached to `egress` specifically. An earlier
    # version had `api` on `frontend` too and believed being off `egress` was
    # enough; the container had `default via 172.21.0.1` and full internet
    # access while the file still read as "api is not on egress". The egress
    # test caught it; reading the topology did not.
    #
    # A browser reaches this service through `web`'s nginx proxy (/api/ ->
    # api:8080 over `internal`), which is why it needs no port of its own.
    networks: [internal]
    environment:
      API_PORT: "8080"
      # §5.1 row 1: the ONLY thing that differs from a firm deployment is
      # these values. There is no local auth mode and no bypass (S29).
      # API_DISCOVERY_URL is the one key here a firm deployment does not set
      # at all, and it is not a bypass by another name: it moves WHERE the
      # keys are fetched, never WHICH issuer is trusted or how a token is
      # checked. One `jwtVerify` call, same options, both environments.
      # NOTE: apps/api/src/config.ts reads API_ISSUER / API_AUDIENCE /
      # API_SUBJECT_CLAIM / API_GROUPS_CLAIM / API_REQUIRED_CLAIMS — there is
      # no "_OIDC_" infix in the real variable names, only in the .env.example
      # names chosen to group them for a reader.
      # THE SAME VALUE THE BROWSER GETS, deliberately, and this is the whole
      # of C1's fix. Keycloak stamps `iss` from the host the token was
      # obtained through, so the string `api` must demand is the published
      # one; demanding the container-network name rejected every token this
      # stack minted. Do NOT "fix" a mismatch here by relaxing the issuer
      # comparison in oidc.ts — that comparison is what stops a development
      # issuer's token being accepted by a firm's deployment (S29).
      API_ISSUER: ${OIDC_ISSUER_BROWSER}
      # …and the address `api` can actually REACH, which is a different fact.
      # `localhost:8088` is the host's port mapping and resolves to nothing
      # from inside the `internal` network, so discovery and JWKS are fetched
      # over the service name. Unset in Azure, where Entra is publicly
      # reachable and the two coincide (apps/api/src/config.ts defaults it to
      # API_ISSUER).
      API_DISCOVERY_URL: ${OIDC_DISCOVERY_API}
      API_AUDIENCE: ${OIDC_AUDIENCE}
      API_SUBJECT_CLAIM: ${OIDC_SUBJECT_CLAIM}
      API_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM}
      API_REQUIRED_CLAIMS: ${OIDC_REQUIRED_CLAIMS}
      API_WORKSPACE_ID: 00000000-0000-0000-0000-000000000001
      API_GATEWAY_URL: https://gateway:8081
      API_MTLS_CA_FILE: /certs/ca.pem
      API_MTLS_CERT_FILE: /certs/api.pem
      API_MTLS_KEY_FILE: /certs/api.key
    volumes: ["./certs:/certs:ro"]
    depends_on:
      gateway: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  gateway:
    build: { context: ., dockerfile: apps/gateway/Dockerfile }
    # NO ports: — unreachable from the host, by construction.
    networks: [internal, egress]
    environment:
      GATEWAY_PORT: "8081"
      GATEWAY_MODELS_FILE: /config/models.json
      # NO DEFAULT (P4, owner decision 5). Unset means the gateway refuses to
      # start, which is what we want: which jurisdictions are permitted
      # follows from the operator's own contracts with their provider, and a
      # compose file has no standing to guess. There is also no
      # GATEWAY_UPSTREAM — offline working is the `recorded` provider on the
      # allowlist (Task 13), not a mode, because a mode would be an
      # environment branch (S30).
      GATEWAY_ALLOWED_JURISDICTIONS: ${GATEWAY_ALLOWED_JURISDICTIONS}
      GATEWAY_CALLER_AUTH: mtls
      GATEWAY_MTLS_CA_FILE: /certs/ca.pem
      GATEWAY_MTLS_CERT_FILE: /certs/gateway.pem
      GATEWAY_MTLS_KEY_FILE: /certs/gateway.key
      GATEWAY_MTLS_ALLOWED_SUBJECT: lexprompt-api
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - "./certs:/certs:ro"
      - "./models.json:/config/models.json:ro"
    # CARRIED OBLIGATION (ruling H1): main.ts applies requestCert/
    # rejectUnauthorized ONLY when caller.mode is 'mtls' (the mode this
    # compose file uses), so a certless caller fails the TLS HANDSHAKE
    # before Fastify routes anything — server.ts's own `/healthz` auth
    # exclusion never runs for it. A healthcheck that curls plain http://,
    # or even https:// with no --cert, would report this container
    # permanently unhealthy while it is in fact fine, and Docker would
    # restart a healthy gateway on a schedule. The cert presented is
    # api.pem/api.key (apps/api's client identity, not the gateway's own
    # server certificate) — server.ts's own comment on this exclusion names
    # that exact invocation. Any cert signed by the same CA satisfies the
    # TLS handshake for /healthz, since the allowed-subject check happens
    # only inside the (bypassed) application-level auth hook; api's is used
    # here because it is the one this compose file already mounts for a
    # reason unrelated to health, and reusing it needs no third cert.
    healthcheck:
      test: [
        "CMD", "curl", "-sf",
        "--cacert", "/certs/ca.pem",
        "--cert", "/certs/api.pem",
        "--key", "/certs/api.key",
        "https://localhost:8081/healthz",
      ]
      interval: 5s
      retries: 30
